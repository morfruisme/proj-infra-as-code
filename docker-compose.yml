services:
  seed:
    build:
      context: seed-data
    networks:
      - front-tier
  loadbalancer:
    image: nginx
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - front-tier
  vote:
    build:
      context: vote
    networks:
      - front-tier
      - back-tier
    ports:
      - "5000:5000"
  result:
    build:
      context: result
    networks:
      - front-tier
      - back-tier
    ports:
      - "8080:8080"
  worker:
    build:
      context: worker
    networks:
      - back-tier
  redis:
    image: redis:alpine
    networks:
      - back-tier
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: db
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/postgresql/data
    networks:
      - back-tier

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
